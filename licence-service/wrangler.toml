# One licence service for every extension; its address is https://licence.<your-subdomain>.workers.dev
name = "licence"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Which browsers each licence key has been activated in (a hash of the key -> random browser IDs).
[[kv_namespaces]]
binding = "ACTIVATIONS"
id = "88611928f74c4ec49ae3ee4b72db269f"

[vars]
SUPPORT_EMAIL = "patchworksupport.6n6ki@silomails.com"
# How many browsers one key can be activated in.
ACTIVATIONS_PER_KEY = "1"

# Which Stripe Payment Link sells which extension. Add one table per Payment Link:
# the plink_… id is on the link's page in the Stripe Dashboard. `product` must match the id the
# extension checks for in its licence.js. Payments made through any link not listed here are refused.
#
# Order Ledger Lifetime, £4.99, LIVE link with Stripe Managed Payments (created 14 Nov 2026).
# The sandbox links were removed on purpose: keep test-mode links out of here, or a test card would get a real key.
[vars.PRODUCTS.plink_1UbmpzRpfFmEPiV0ujJkaUWH]
product = "order-ledger"
name = "Order Ledger"
plan = "lifetime"

# Secrets, set with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put LICENCE_PRIVATE_JWK
